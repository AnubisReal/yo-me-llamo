name: Imagen Docker
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - run: python3 -m py_compile app.py library.py prepare_storage.py
      - run: node --check static/app.js
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de imagen
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yo-me-llamo" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verificar contenedor y stack
        if: github.event_name != 'pull_request'
        env:
          SMOKE_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          YML_TOKEN: ci-smoke-only
        shell: bash
        run: |
          export IMAGE="$SMOKE_IMAGE" PUID=12001 PGID=12001 PORT=18787
          docker compose config --quiet
          sudo mkdir -p /instalaciones/yo-me-llamo/data /instalaciones/yo-me-llamo/tmp /extraible2/Series
          sudo touch /instalaciones/yo-me-llamo/data/.instance.lock
          sudo chmod 700 /instalaciones/yo-me-llamo/data /instalaciones/yo-me-llamo/tmp
          sudo chmod 600 /instalaciones/yo-me-llamo/data/.instance.lock
          sudo chown 12001:12001 /extraible2/Series
          sudo touch /extraible2/Series/existing-video.mp4
          sudo chmod 444 /extraible2/Series/existing-video.mp4
          original_media_owner=$(stat -c '%u:%g:%a' /extraible2/Series/existing-video.mp4)
          trap 'docker compose logs; docker compose down' EXIT
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18787/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18787/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18787/api/status)" = 401
          curl -fsS -H "Authorization: Bearer $YML_TOKEN" http://127.0.0.1:18787/api/status \
            | python3 -c "import json,sys; data=json.load(sys.stdin); assert data['settings']['configured'] is False; print('Contenedor OK: autenticación y configuración inicial verificadas.')"
          test "$(sudo stat -c '%u:%g' /instalaciones/yo-me-llamo/data/.instance.lock)" = "12001:12001"
          test "$(stat -c '%u:%g:%a' /extraible2/Series/existing-video.mp4)" = "$original_media_owner"
          test "$(docker inspect --format '{{.Config.User}}' yo-me-llamo)" = "12001:12001"
          echo 'Permisos preparados automáticamente; biblioteca existente sin cambios.'
          curl -fsS -H "Authorization: Bearer $YML_TOKEN" -H 'Content-Type: application/json' \
            -d '{"download_workers":4}' http://127.0.0.1:18787/api/concurrency \
            | python3 -c "import json,sys; assert json.load(sys.stdin)['download_workers']==4"
          docker compose exec -T yo-me-llamo ffmpeg -protocols 2>/dev/null | grep -w httpproxy
          echo 'Concurrencia configurable y transporte de proxy verificados.'
